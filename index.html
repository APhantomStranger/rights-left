<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<style>
  :root{
    --ink:#0A0A0B; --panel:#121216; --panel2:#17171c;
    --paper:#F6F6F4; --paper-dim:#B6B7BD; --paper-faint:#77787F;
    --line:rgba(246,246,244,.13); --line-strong:rgba(246,246,244,.28);
    --blue:#3B6FF6; --blue-bright:#7CA6FF; --blue-deep:#1E3A8A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--paper-dim);
    font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;}
  a{color:var(--blue-bright);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  .mono{font-family:"IBM Plex Mono",monospace}
  .eyebrow{font-family:"IBM Plex Mono",monospace;text-transform:uppercase;
    letter-spacing:.18em;font-size:11px;color:var(--blue-bright)}

  /* top bar */
  .top{position:sticky;top:0;z-index:50;background:rgba(10,10,11,.82);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;gap:18px;height:64px}
  .mark{font-family:"Archivo",sans-serif;font-weight:800;text-transform:uppercase;
    letter-spacing:.02em;font-size:22px;color:var(--paper);display:flex;align-items:center;gap:8px;white-space:nowrap}
  .mark .stamp{background:var(--blue);color:var(--ink);padding:1px 8px;border-radius:2px}
  .mark .cursor{width:10px;height:19px;background:var(--paper);display:inline-block;
    transform:translateY(2px);animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .top-tag{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--paper-faint);
    text-transform:uppercase;letter-spacing:.14em;border-left:1px solid var(--line);padding-left:16px}
  .controls{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  select,input[type=search]{background:var(--panel);color:var(--paper);border:1px solid var(--line-strong);
    border-radius:3px;padding:8px 10px;font-family:"IBM Plex Mono",monospace;font-size:12px}
  input[type=search]{width:150px}
  select:focus,input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
  /* full subscribe label while there's room for it; short one once there isn't */
  .sub-short{display:none}
  @media(max-width:1000px){.sub-full{display:none}.sub-short{display:inline}}
  @media(max-width:720px){.top-tag{display:none}.controls{gap:6px}input[type=search]{width:110px}}

  /* hero */
  .hero{border-bottom:1px solid var(--line);padding:64px 0 48px}
  .hero .eyebrow{margin-bottom:18px}
  .htitle{font-family:"Archivo",sans-serif;font-weight:800;color:var(--paper);
    text-transform:uppercase;line-height:.92;letter-spacing:-.01em;
    font-size:clamp(2.6rem,7.5vw,6rem);margin:0 0 8px;position:relative;display:block}
  .htitle .rights{color:#E53935}
  .htitle .left{color:var(--blue);position:relative}
  .htitle .left::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;
    background:var(--blue);transform-origin:left;
    animation:declass .75s cubic-bezier(.7,0,.2,1) .25s both}
  @keyframes declass{0%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .hsub{font-size:clamp(1.05rem,2.2vw,1.35rem);color:var(--paper);margin:20px 0 0;
    font-weight:500;line-height:1.4;text-wrap:balance}
  .hstand{color:var(--paper-dim);margin:14px 0 0;text-wrap:pretty}
  .hmeta{display:flex;flex-wrap:wrap;gap:26px;margin-top:30px;align-items:flex-end}
  /* category filter + search now live here rather than in the top bar, so they
     sit on the same line as the stats and leave the nav row to Subscribe/Support */
  .hero-filters{display:flex;gap:10px;align-items:center;margin-left:auto;margin-bottom:2px}
  .hero-filters input[type=search]{width:190px}
  @media(max-width:900px){
    .hero-filters{margin-left:0;width:100%;flex-wrap:wrap}
    .hero-filters select{flex:1 1 150px;min-width:0}
    .hero-filters input[type=search]{flex:1 1 130px;min-width:0;width:auto}
  }
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat b{font-family:"Archivo",sans-serif;font-weight:800;color:var(--paper);font-size:34px;line-height:1}
  .stat span{font-family:"IBM Plex Mono",monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:.14em;color:var(--paper-faint)}
  .infile{margin-top:34px;border-top:1px solid var(--line);padding-top:22px}
  .infile h4{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--blue-bright);margin:0 0 12px}
  .infile ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
  .infile li{display:flex;gap:12px;align-items:baseline}
  .infile .fn{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--blue);flex:none}
  .infile button{all:unset;cursor:pointer;color:var(--paper);line-height:1.35}
  .infile button:hover{color:var(--blue-bright)}

  .newsince{border-top:none;margin-top:26px;padding:18px 20px;border-radius:6px;
    background:rgba(59,111,246,.08);border:1px solid rgba(59,111,246,.35)}
  .newsince h4{color:var(--blue-bright)}
  .newsince-more{margin:10px 0 0;font-size:12.5px;color:var(--paper-faint)}

  /* record layout */
  .record{padding:52px 0 20px}
  .rhead{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--paper-faint);margin:0 0 20px;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .grid{display:grid;grid-template-columns:280px 1fr;gap:40px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr;gap:26px}}

  /* archive */
  .archive{position:sticky;top:84px;max-height:calc(100vh - 108px);overflow:auto;
    border:1px solid var(--line);border-radius:4px;background:var(--panel)}
  @media(max-width:900px){.archive{position:static;max-height:340px}}
  .archive-h{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--paper-faint);padding:14px 16px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--panel)}
  .wk{all:unset;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;
    padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line);position:relative}
  .wk:hover{background:var(--panel2)}
  .wk.active{background:var(--panel2)}
  .wk.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
  .wk.dim{opacity:.4}
  .wk .d{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--paper);flex:1;letter-spacing:.01em}
  .wk.active .d{color:var(--paper)}
  .wk .c{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--blue-bright);
    background:rgba(59,111,246,.14);border:1px solid rgba(59,111,246,.3);border-radius:10px;
    padding:1px 8px;flex:none}

  /* trending + category breakdown, in the archive sidebar */
  .side-block{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .trend-row{all:unset;display:flex;align-items:center;gap:8px;padding:5px 14px;font-size:12px;
    width:100%;box-sizing:border-box;cursor:pointer;border-radius:4px}
  .trend-row:hover{background:var(--panel2)}
  .trend-row:hover .trend-label{color:var(--blue-bright);text-decoration:underline}
  .trend-label{flex:0 0 96px;color:var(--paper-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trend-track{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
  .trend-bar{height:100%;background:var(--blue);border-radius:3px}
  .trend-count{flex:none;font-family:"IBM Plex Mono",monospace;color:var(--blue-bright);font-size:11px;width:22px;text-align:right}
  .pie-wrap{padding:6px 14px 4px}
  .pie{width:100%;max-width:150px;display:block;margin:4px auto 14px}
  .pie-legend{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .pie-legend li{font-size:11.5px;color:var(--paper-dim)}
  .pie-legend-btn{all:unset;display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;
    cursor:pointer;padding:3px 4px;border-radius:4px}
  .pie-legend-btn:hover{background:var(--panel2)}
  .pie-legend-btn:hover .pl-name{color:var(--blue-bright);text-decoration:underline}
  .pie-legend .swatch{width:9px;height:9px;border-radius:2px;flex:none}
  .pie-legend .pl-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:inherit}
  .pie-legend .pl-pct{flex:none;font-family:"IBM Plex Mono",monospace;color:var(--paper-faint)}
  .pie-slice{cursor:pointer;transition:opacity .12s}
  .pie-slice:hover{opacity:.78}
  .clear-link{all:unset;cursor:pointer;color:var(--blue-bright);text-decoration:underline;
    margin-left:8px;font-size:inherit;font-family:inherit}
  .clear-link:hover{color:var(--paper)}

  /* reader */
  .wtitle{font-family:"Archivo",sans-serif;font-weight:800;color:var(--paper);
    text-transform:uppercase;font-size:clamp(1.35rem,3.4vw,2.4rem);line-height:1.04;margin:0 0 4px;
    letter-spacing:-.01em;text-wrap:balance}
  .wtitle small{display:block;font-family:"IBM Plex Mono",monospace;font-weight:500;
    font-size:12px;letter-spacing:.14em;color:var(--paper-faint);margin-top:10px;text-transform:uppercase}
  .cards{display:grid;gap:20px;margin-top:26px}
  .card{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:4px;
    background:var(--panel);overflow:hidden}
  .plate{display:flex;align-items:center;gap:12px;background:var(--panel2);
    border-bottom:1px dashed var(--line-strong);padding:11px 18px}
  .plate .glyph{width:26px;height:26px;color:var(--blue-bright);flex:none}
  .plate .glyph svg{width:100%;height:100%}
  .plate .pcat{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--paper)}
  .plate .pmeta{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;
    letter-spacing:.1em;color:var(--paper-faint);text-transform:uppercase;text-align:right}
  .card img{width:100%;display:block;max-height:280px;object-fit:cover;border-bottom:1px solid var(--line)}
  .cbody{padding:18px 20px 20px}
  .headline{font-family:"Archivo",sans-serif;font-weight:700;color:var(--paper);
    font-size:1.28rem;line-height:1.25;margin:0 0 12px}
  .summary{color:var(--paper-dim);line-height:1.62;margin:0}
  .source{margin-top:16px;padding-top:13px;border-top:1px solid var(--line);
    font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--paper-faint);
    display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
  .source .lbl{color:var(--blue-bright);letter-spacing:.08em}
  .source .out{color:var(--paper)}
  .nolink{color:var(--paper-faint);font-style:italic}
  .empty{border:1px dashed var(--line-strong);border-radius:4px;padding:40px;text-align:center;
    color:var(--paper-faint);font-family:"IBM Plex Mono",monospace;font-size:13px}

  /* share this week */
  .share-wrap{position:relative;display:inline-block;margin-left:10px;vertical-align:middle}
  .share-btn{all:unset;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--blue-bright);
    border:1px solid var(--line-strong);border-radius:3px;padding:4px 10px}
  .share-btn:hover{color:var(--paper);border-color:var(--blue);background:var(--panel2)}
  .share-pop{position:absolute;top:calc(100% + 7px);left:0;z-index:60;min-width:186px;
    background:var(--panel);border:1px solid var(--line-strong);border-radius:5px;
    padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:1px;
    text-transform:none;letter-spacing:normal}
  .share-pop-h{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--paper-faint);padding:6px 10px 7px;
    border-bottom:1px solid var(--line);margin-bottom:4px}
  .share-pop a,.share-copy{all:unset;cursor:pointer;display:block;box-sizing:border-box;width:100%;
    font-family:"IBM Plex Sans",sans-serif;font-size:13px;color:var(--paper-dim);
    padding:8px 10px;border-radius:3px}
  .share-pop a:hover,.share-copy:hover{background:var(--panel2);color:var(--paper)}
  .share-note{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;
    color:var(--paper-faint);margin-top:2px;letter-spacing:.02em;white-space:nowrap}
  .share-toast{position:absolute;top:calc(100% + 7px);left:0;z-index:61;width:min(320px,80vw);
    background:var(--blue-deep);border:1px solid var(--blue);color:var(--paper);border-radius:5px;
    padding:10px 12px;font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;line-height:1.45;
    text-transform:none;letter-spacing:normal;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  @media(max-width:520px){.share-toast{left:auto;right:0}}
  .share-copy{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--blue-bright)}
  @media(max-width:520px){.share-pop{left:auto;right:0}}

  /* entry points to the All Weeks archive */
  .hero-archive-btn{all:unset;cursor:pointer;align-self:flex-end;margin-bottom:4px;
    font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;
    color:var(--blue-bright);border-bottom:1px solid var(--line-strong);padding-bottom:3px}
  .hero-archive-btn:hover{color:var(--paper);border-color:var(--blue)}
  .allweeks-link{border-top:2px solid var(--line-strong);color:var(--blue-bright);font-weight:600}
  .allweeks-link:hover{background:var(--panel2);color:var(--paper)}
  .allweeks-link .d{color:inherit}

  /* All Weeks archive page */
  .allweeks{padding:54px 0 80px}
  .aw-title{font-family:"Archivo",sans-serif;font-weight:800;color:var(--paper);
    text-transform:uppercase;line-height:1.02;letter-spacing:-.01em;
    font-size:clamp(1.55rem,3.9vw,2.7rem);margin:14px 0 10px;text-wrap:balance}
  /* scoped deliberately to .aw-title so the hero's declassify animation on
     .htitle .left doesn't come along with the shared colour names */
  .aw-title .rights{color:#E53935}
  .aw-title .ledger{color:var(--blue)}
  .aw-sub{color:var(--paper-dim);margin:0 0 26px;text-wrap:pretty}
  .aw-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:16px 0 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .aw-toolbar input[type=search]{width:240px;flex:1 1 200px;max-width:340px}
  .aw-back,.aw-dl{all:unset;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:12px;
    letter-spacing:.06em;padding:8px 14px;border-radius:3px;border:1px solid var(--line-strong);
    color:var(--paper-dim)}
  .aw-back:hover{color:var(--paper);border-color:var(--blue)}
  .aw-dl{margin-left:auto;background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
  .aw-dl:hover{filter:brightness(1.12)}
  .aw-count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--paper-faint);
    margin:16px 0 0;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .aw-jump{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
  .aw-jump a{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
    color:var(--paper-dim);text-decoration:none;padding:5px 10px;border-radius:3px;
    border:1px solid var(--line);background:var(--panel)}
  .aw-jump a:hover{color:var(--paper);border-color:var(--blue);background:var(--panel2)}

  .aw-month{margin-top:42px;scroll-margin-top:96px}
  .aw-month-h{font-family:"Archivo",sans-serif;font-weight:800;color:var(--paper);
    text-transform:uppercase;font-size:clamp(1.15rem,3.2vw,1.5rem);letter-spacing:.01em;margin:0 0 4px;
    padding-bottom:10px;border-bottom:2px solid var(--line-strong);
    display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .aw-month-h span{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;
    letter-spacing:.14em;color:var(--paper-faint);text-transform:uppercase;flex:none}
  .aw-week{margin-top:22px}
  .aw-week-h{margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
  .aw-week-h button{all:unset;cursor:pointer;font-family:"IBM Plex Mono",monospace;
    font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-bright)}
  .aw-week-h button:hover{color:var(--paper);text-decoration:underline}
  .aw-week-c{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--blue-bright);
    background:rgba(59,111,246,.14);border:1px solid rgba(59,111,246,.3);border-radius:10px;
    padding:1px 8px;flex:none}
  .aw-list{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .aw-list li{display:flex;gap:14px;padding:13px 16px;background:var(--panel);align-items:flex-start}
  .aw-list li:hover{background:var(--panel2)}
  .aw-fn{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--paper-faint);
    flex:none;padding-top:2px;min-width:30px}
  .aw-body{display:flex;flex-direction:column;gap:5px;min-width:0}
  .aw-head{color:var(--paper);font-size:15px;line-height:1.4}
  .aw-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--paper-faint)}
  .aw-cat{color:var(--blue-bright);text-transform:uppercase;letter-spacing:.1em;font-size:10px}
  .aw-meta a{color:var(--blue-bright);text-decoration:none}
  .aw-meta a:hover{text-decoration:underline}
  .aw-foot{margin-top:46px;padding-top:22px;border-top:1px solid var(--line)}
  @media(max-width:720px){
    .aw-dl{margin-left:0}
    .aw-toolbar input[type=search]{max-width:none}
  }

  /* footer */
  footer{border-top:1px solid var(--line);margin-top:60px;padding:40px 0 70px}
  .disc{background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:20px 22px;font-size:13.5px;color:var(--paper-dim);line-height:1.6;max-width:820px}
  .disc b{color:var(--paper);font-weight:600}
  .fmeta{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--paper-faint);margin-top:24px;display:flex;flex-wrap:wrap;gap:6px 20px}

  /* nav links + support button */
  .mark{cursor:pointer}
  .nav-links{display:flex;gap:6px;align-items:center}
  /* Each link is underlined and words inside a link sit close together, so
     multi-word links ("MAGA Crime Tracker", "All Weeks") read as ONE link. */
  .nav-links button{background:none;border:none;cursor:pointer;font-family:"IBM Plex Mono",monospace;
    font-size:12px;text-transform:uppercase;letter-spacing:.04em;word-spacing:-.25em;color:var(--paper-dim);
    padding:6px 9px;border-radius:3px;white-space:nowrap;

function match(e, cat, q){
  if(cat!=="All" && e.cat!==cat) return false;
  if(q){
    const s=(e.event+" "+e.impact+" "+e.cat+" "+e.outlet).toLowerCase();
    if(!s.includes(q.toLowerCase())) return false;
  }
  return true;
}

const MONTHS_SHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function ordinal(n){
  const j=n%10, k=n%100;
  if(j===1 && k!==11) return n+"st";
  if(j===2 && k!==12) return n+"nd";
  if(j===3 && k!==13) return n+"rd";
  return n+"th";
}
// "Week Of" labels are always a Monday (see gather.py) — expand that single
// date into the full Monday-through-Sunday range for display. Falls back to
// the plain label untouched if it ever fails to parse, rather than showing
// a broken date.
function formatWeekRange(weekLabel){
  const start=new Date(weekLabel);
  if(isNaN(start)) return weekLabel;
  const end=new Date(start);
  end.setDate(start.getDate()+6);
  const startStr=MONTHS_SHORT[start.getMonth()]+" "+ordinal(start.getDate());
  const endStr=MONTHS_SHORT[end.getMonth()]+" "+ordinal(end.getDate());
  return start.getFullYear()===end.getFullYear()
    ? `${startStr} – ${endStr}, ${start.getFullYear()}`
    : `${startStr}, ${start.getFullYear()} – ${endStr}, ${end.getFullYear()}`;
}

const MONTHS_FULL=["January","February","March","April","May","June",
  "July","August","September","October","November","December"];
// A "Week Of" label is always that week's Monday, so a week that straddles
// two months is filed under the month it STARTED in. Keeps every week in
// exactly one place instead of splitting or duplicating it.
function monthOf(weekLabel){
  const d=new Date(weekLabel);
  if(isNaN(d)) return {key:"undated",label:"Undated"};
  return {
    key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),
    label:MONTHS_FULL[d.getMonth()]+" "+d.getFullYear()
  };
}

// ---- Deep links to a single week -------------------------------------------
// The site is one page with no server-side routing, so a bare link to
// rightsleft.org always shows whatever the NEWEST week happens to be. That
// makes a shared link rot: post it in August, and by September it points at
// different entries. So each week gets a stable #week=YYYY-MM-DD fragment,
// read on load and kept in sync as you browse. Without this the share
// buttons below would be quietly misleading rather than useful.
function weekSlug(weekLabel){
  const d=new Date(weekLabel);
  if(isNaN(d)) return "";
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")
    +"-"+String(d.getDate()).padStart(2,"0");
}
function weekIndexFromHash(){
  const m=(location.hash||"").match(/week=([0-9]{4}-[0-9]{2}-[0-9]{2})/);
  if(!m) return -1;
  return DATA.findIndex(w=>weekSlug(w.week)===m[1]);
}
function weekUrl(weekLabel){
  const base=location.origin+location.pathname;
  const slug=weekSlug(weekLabel);
  return slug ? base+"#week="+slug : base;
}

// ---- Share targets ----------------------------------------------------------
// Endpoint formats verified against each platform's current documentation.
// Note Facebook is the odd one out: its sharer accepts ONLY a url and ignores
// any text you pass, pulling the headline and image from the page's Open Graph
// tags instead. So the shared text below applies to the other three.
const SHARE_BASE="America's Changelog With Eyes on the Trump Administration";
const SHARE_TAIL="Keeping track of what's been lost in America";
const SHARE_HASHTAGS="#politics #elections #democrats #trump #resistance";
function shareText(weekLabel){
  return SHARE_BASE+"\nFor the week of "+formatWeekRange(weekLabel)+"\n"+SHARE_TAIL;
}
// Facebook's sharer only accepts a link — it dropped its old prefilled-text
// parameter, and its platform rules don't allow pre-filling a person's post.
// So for Facebook the text is copied to the clipboard as the share window
// opens, ready to paste. (`copy` marks a target that needs that.)
function shareTargets(weekLabel){
  const url=weekUrl(weekLabel);
  const text=shareText(weekLabel);
  const tagged=text+"\n"+SHARE_HASHTAGS;
  const u=encodeURIComponent(url);
  return [
    {name:"X",        href:"https://twitter.com/intent/tweet?url="+u+"&text="+encodeURIComponent(tagged)},
    {name:"Bluesky",  href:"https://bsky.app/intent/compose?text="+encodeURIComponent(tagged+"\n"+url)},
    {name:"Facebook", href:"https://www.facebook.com/sharer/sharer.php?u="+u, copy:text},
    {name:"Reddit",   href:"https://www.reddit.com/submit?url="+u+"&title="+encodeURIComponent(text)},
  ];
}

// Copy a string, with a fallback for browsers/contexts without the
// clipboard API. Calls done() only if the copy actually worked.
function copyToClipboard(str, done){
  function fallback(){
    const ta=document.createElement("textarea");
    ta.value=str; ta.setAttribute("readonly","");
    ta.style.position="absolute"; ta.style.left="-9999px";
    document.body.appendChild(ta); ta.select();
    try{ if(document.execCommand("copy")) done(); }catch(err){ /* leave silent */ }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(done).catch(fallback);
  } else { fallback(); }
}

// Download the (currently filtered) archive. Tries for a real .xlsx by
// lazy-loading SheetJS only on click — so the library costs nothing on page
// load and is never a dependency for anyone who doesn't use the button. If
// that fetch fails for any reason, falls back to CSV, which Excel opens
// natively, so the button always produces a usable file.
function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=src; s.onload=resolve; s.onerror=()=>reject(new Error("load failed"));
    document.head.appendChild(s);
  });
}
function downloadArchive(rows){
  const header=["File No.","Week Of","Date","Category","Headline","Outlet","Source URL"];
  const body=rows.map(e=>[e.n,e.week,e.srcdate,e.cat,e.srcdesc,e.outlet,e.url]);
  const saveCsv=()=>{
    const esc=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const csv=[header,...body].map(r=>r.map(esc).join(",")).join("\r\n");
    // BOM so Excel reads the UTF-8 correctly (curly quotes, dashes, etc.)
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="rights-left-archive.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  };
  const build=()=>{
    const ws=window.XLSX.utils.aoa_to_sheet([header,...body]);
    ws["!cols"]=[{wch:9},{wch:15},{wch:13},{wch:26},{wch:72},{wch:16},{wch:52}];
    ws["!freeze"]={xSplit:"0",ySplit:"1"};
    const wb=window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb,ws,"Rights Left");
    window.XLSX.writeFile(wb,"rights-left-archive.xlsx");
  };
  if(window.XLSX){ try{ build(); }catch(err){ saveCsv(); } return; }
  loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js")
    .then(()=>{ try{ build(); }catch(err){ saveCsv(); } })
    .catch(saveCsv);
}

function PieChart({data,onSelect}){
  const total=data.reduce((s,d)=>s+d.count,0);
  const r=42,cx=50,cy=50;
  let angle=-90;   // start at 12 o'clock, slices proceed clockwise
  const slices=data.map((d,i)=>{
    const frac=d.count/total;
    const start=angle, end=angle+frac*360;
    angle=end;
    const large=(end-start)>180?1:0;
    const toXY=(deg)=>{ const rad=deg*Math.PI/180; return [cx+r*Math.cos(rad),cy+r*Math.sin(rad)]; };
    const [x0,y0]=toXY(start), [x1,y1]=toXY(end);
    const path=frac>=0.9995
      ? `M ${cx-r},${cy} A ${r},${r} 0 1,1 ${cx+r-0.01},${cy} A ${r},${r} 0 1,1 ${cx-r},${cy} Z`
      : `M ${cx},${cy} L ${x0},${y0} A ${r},${r} 0 ${large},1 ${x1},${y1} Z`;
    return {...d,path,color:`hsl(${Math.round(i*360/data.length)},58%,54%)`};
  });
  return (<div className="pie-wrap">
    <svg viewBox="0 0 100 100" className="pie" role="img" aria-label="Share of entries by category">
      {slices.map(s=>(
        <path key={s.category} d={s.path} fill={s.color} className="pie-slice"
          onClick={()=>onSelect(s.category)}>
          <title>{s.category} — click to see all entries</title>
        </path>))}
    </svg>
    <ul className="pie-legend">
      {slices.map(s=>(
        <li key={s.category}>
          <button className="pie-legend-btn" onClick={()=>onSelect(s.category)}>
            <span className="swatch" style={{background:s.color}}/>
            <span className="pl-name">{s.category}</span>
            <span className="pl-pct">{Math.round(s.count/total*100)}%</span>
          </button>
        </li>))}
    </ul>
  </div>);
}

function ShareMenu({weekLabel}){
  const [open,setOpen]=React.useState(false);

  const wrapRef=React.useRef(null);

  // close on outside click / Escape, and only while actually open
  React.useEffect(()=>{
    if(!open) return;
    function onDoc(ev){ if(wrapRef.current && !wrapRef.current.contains(ev.target)) setOpen(false); }
    function onKey(ev){ if(ev.key==="Escape") setOpen(false); }
    document.addEventListener("mousedown",onDoc);
    document.addEventListener("keydown",onKey);
    return ()=>{ document.removeEventListener("mousedown",onDoc); document.removeEventListener("keydown",onKey); };
  },[open]);

  const [toast,setToast]=React.useState("");

  // reset the transient confirmations when switching weeks
  React.useEffect(()=>{ setCopied(false); setOpen(false); setToast(""); },[weekLabel]);

  function copyLink(){
    copyToClipboard(weekUrl(weekLabel),
      ()=>{ setCopied(true); setTimeout(()=>setCopied(false),1800); });
  }

  // Facebook: copy the post text, then open the share window as a popup so
  // this page — and the "paste it" note — stays visible behind it.
  function shareWithCopiedText(ev,target){
    ev.preventDefault();
    setOpen(false);

      setToast("Post text copied — click in the Facebook post box and paste it (Ctrl+V, or ⌘V on a Mac).");
      setTimeout(()=>setToast(""),9000);

    const w=window.open(target.href,"rl-share","width=640,height=600");
    if(w){ try{ w.opener=null; }catch(err){} }
    else { window.open(target.href,"_blank"); }   // popup blocked: plain new tab
  }

  return (<span className="share-wrap" ref={wrapRef}>
    <button className="share-btn" onClick={()=>{ setToast(""); setOpen(o=>!o); }}

        {copied ? "✓ Link copied" : "Copy link"}</button>

  </span>);
}

const IC_TYPE_GLYPH={"Criminal":"gavel","Civil":"scales","Impeachment":"building",
  "Contempt":"alert","Ethics & Professional":"shield","Investigation":"people"};
const IC_GUILTY=new Set(["Pleaded guilty","Convicted","Sentenced","Judgment against","Held in contempt",
  "Violation found","Disbarred","License suspended","Impeached"]);
const IC_RESOLVED=new Set(["Acquitted","Dismissed","Overturned","Resolved","Closed — no action","Impeached & acquitted","Settled"]);
const IC_PARDON=new Set(["Pardoned","Commuted"]);
function icStatusClass(st){
  if(IC_GUILTY.has(st)) return "st-guilty";
  if(IC_PARDON.has(st)) return "st-pardon";
  if(IC_RESOLVED.has(st)) return "st-resolved";
  return "st-open";
}
function icDate(d){
  if(!d) return "";
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
  if(!m) return d;
  const dt=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  return dt.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});
}
function icMatch(m,f){
  if(f.group!=="All" && m.group!==f.group) return false;
  if(f.status!=="All" && icStatusClass(m.status)!==f.status) return false;
  if(f.type!=="All" && m.matter_type!==f.type) return false;
  if(f.offense && m.offense!==f.offense) return false;
  if(f.q){
    const s=[m.name,m.role,m.group,m.matter,m.offense,m.status,m.summary,m.jurisdiction,m.case_number]
      .join(" ").toLowerCase();
    if(!f.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>s.includes(w))) return false;
  }
  return true;
}

  React.useEffect(()=>{

  // MAGA Crime Tracker page gets its own address (rightsleft.org/#crimes) so it can be shared
  function goCrimes(){
    setView("crimes"); window.scrollTo({top:0,behavior:"smooth"});
    if(location.hash!=="#crimes") history.replaceState(null,"",location.pathname+location.search+"#crimes");
  }
  function clearCrimesHash(){
    if(location.hash==="#crimes") history.replaceState(null,"",location.pathname+location.search);
  }
  function goAbout(){ setView("about"); clearCrimesHash(); window.scrollTo({top:0,behavior:"smooth"}); }
  function goWeeks(){ setView("weeks"); clearCrimesHash(); window.scrollTo({top:0,behavior:"smooth"}); }

  // Archive page: months (newest first) -> weeks (newest first) -> entries.
  // DATA is already sorted newest-first by build_site.py, so month order and
  // week order both fall out of that automatically — nothing re-sorts here.
  // Weeks (and whole months) with no matching entries drop out while filtering.
  const awMonths=React.useMemo(()=>{
    const months=[],seen={};
    DATA.forEach(w=>{
      const hits=w.entries.filter(e=>match(e,acat,aq));
      if(!hits.length) return;
      const m=monthOf(w.week);
      if(!seen[m.key]){ seen[m.key]={key:m.key,label:m.label,weeks:[],count:0}; months.push(seen[m.key]); }
      seen[m.key].weeks.push({week:w.week,hits});
      seen[m.key].count+=hits.length;
    });
    return months;
  },[acat,aq]);

  // Flat rows for the download — same filter, so the file matches what's shown.
  const awRows=React.useMemo(()=>DATA.flatMap(w=>
    w.entries.filter(e=>match(e,acat,aq)).map(e=>({...e,week:w.week}))
  ),[acat,aq]);

  function jumpToWeek(weekLabel){
    const i=DATA.findIndex(w=>w.week===weekLabel);
    if(i<0) return;
    setIdx(i); setCatView(false); setCat("All"); setQ(""); setView("record");
    userPickedWeek.current=true;
    window.scrollTo({top:0,behavior:"smooth"});
  }

  // Has the user actively picked a week in this session? Used below to decide
  // whether the URL should be rewritten. See the effect for the full reason.
  const userPickedWeek = React.useRef(false);

  // Open straight to a shared week if the URL carries one, and keep responding
  // to the back/forward buttons afterwards.
  React.useEffect(()=>{
    const i=weekIndexFromHash();
    if(i>=0){ setIdx(i); setView("record"); userPickedWeek.current=true; }
    function onHash(){
      if(location.hash==="#crimes"){ setView("crimes"); return; }
      const j=weekIndexFromHash();
      if(j>=0){ setIdx(j); setView("record"); setCatView(false); userPickedWeek.current=true; }
    }
    window.addEventListener("hashchange",onHash);
    return ()=>window.removeEventListener("hashchange",onHash);
  },[]);

  // Keep the address bar in sync with the week being viewed, so copying the URL
  // out of the browser works as well as the Share button does. But only AFTER
  // the user actually picks a week — a bare rightsleft.org bookmark should
  // stay bare so that reopening it always lands on the newest week, rather
  // than silently getting rewritten to whatever week happened to be showing
  // when the tab was last open.
  React.useEffect(()=>{
    if(view!=="record" || catView) return;
    if(!userPickedWeek.current) return;
    const slug=weekSlug(DATA[idx] && DATA[idx].week);
    if(!slug) return;
    const want="#week="+slug;
    if(location.hash!==want){
      history.replaceState(null,"",location.pathname+location.search+want);
    }
  },[idx,view,catView]);

  const counts=DATA.map(w=>w.entries.filter(e=>match(e,cat,q)).length);
  const active=DATA[idx];
  const shown=catView
    ? DATA.flatMap(w=>w.entries).filter(e=>match(e,cat,q))
    : active.entries.filter(e=>match(e,cat,q));
  const latest=DATA[0];
  const catCount=new Set(latest.entries.map(e=>e.cat)).size;

  // Dynamic totals — these update automatically when DATA grows
  const totalEntries=DATA.reduce((sum,w)=>sum+w.entries.length,0);
  const totalWeeks=DATA.length;
  const highestFileNo=Math.max(...DATA.flatMap(w=>w.entries.map(e=>e.n)));

  function pick(i){
    setIdx(i);
    setCatView(false);
    userPickedWeek.current=true;
    if(window.innerWidth<=900 && readerRef.current){
      readerRef.current.scrollIntoView({behavior:"smooth",block:"start"});
    }
  }

  // Entry point for clicking a category in Trending or the pie chart: shows
  // every entry in that category across every week, not just the current one.
  function viewCategory(c){
    setCat(c); setQ(""); setCatView(true);
    if(window.innerWidth<=900 && readerRef.current){
      readerRef.current.scrollIntoView({behavior:"smooth",block:"start"});
    }
  }
  function clearCatView(){ setCatView(false); setCat("All"); setQ(""); }

  return (<React.Fragment>
    <header className="top"><div className="wrap">
      <div className="mark" onClick={goRecord} role="button" tabIndex={0}
        onKeyDown={e=>{if(e.key==="Enter"||e.key===" ")goRecord();}}>
        RIGHTS<span className="stamp">LEFT</span><span className="cursor"></span></div>
      <nav className="nav-links">
        <button className={view==="record"?"active":""} onClick={goRecord}>The Record</button>
        <button className={view==="crimes"?"active":""} onClick={goCrimes}>MAGA Crime Tracker</button>
        <button className={view==="weeks"?"active":""} onClick={goWeeks}>All Weeks</button>
        <button className={view==="about"?"active":""} onClick={goAbout}>About</button>
      </nav>
      <div className="controls">
        {BUTTONDOWN_USERNAME && <button className="support-btn subscribe-btn" onClick={()=>setShowSubscribe(true)}>✉ <span className="sub-full">Subscribe for Weekly Email Report</span><span className="sub-short">Subscribe</span></button>}
        <button className="support-btn" onClick={()=>setShowSupport(true)}>♥ Support</button>
      </div>
    </div></header>

    {view==="record" && <React.Fragment>
    <section className="hero"><div className="wrap">
      <div className="eyebrow">Latest dispatch · File No. {String(highestFileNo).padStart(3,"0")} · Week of {formatWeekRange(latest.week)}</div>
      <h1 className="htitle">THE <span className="rights">RIGHTS</span><br/>WE HAVE <span className="left">LEFT</span></h1>
      <p className="hsub">The Project to Keep a Ledger of What's Been Done and What's Been Lost</p>
      <p className="hstand">This week: {latest.entries.length} logged {latest.entries.length===1?"action":"actions"} across {catCount} {catCount===1?"category":"categories"}. Browse every prior week in the archive below.</p>
      <div className="hmeta">
        <div className="stat"><b>{totalEntries}</b><span>Entries logged</span></div>
        <div className="stat"><b>{totalWeeks}</b><span>Weeks on record</span></div>
        <button className="hero-archive-btn" onClick={goWeeks}>View All Weeks →</button>
        <div className="hero-filters">
          <select value={cat} onChange={e=>{setCat(e.target.value);setCatView(false);}} aria-label="Filter by category">
            <option value="All">All categories</option>
            {CATS.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <input type="search" placeholder="Search…" value={q}
            onChange={e=>setQ(e.target.value)} aria-label="Search entries"/>
        </div>
      </div>
      {newSince.length>0 && <div className="infile newsince">
        <h4>New Events Since Your Last Visit</h4>
        <ul>
          {newSince.slice(0,5).map(e=>(
            <li key={e.n}>
              <span className="fn">{String(e.n).padStart(3,"0")}</span>
              <button onClick={()=>{setCat("All");setQ("");pick(DATA.findIndex(w=>w.entries.includes(e)));}}>{e.srcdesc}</button>
            </li>))}
        </ul>
        {newSince.length>5 && <p className="newsince-more">+ {newSince.length-5} more since your last visit</p>}
      </div>}
      <div className="infile">
        <h4>In This Week's File:</h4>
        <ul>
          {latest.entries.slice(0,3).map(e=>(
            <li key={e.n}>
              <span className="fn">{String(e.n).padStart(3,"0")}</span>
              <button onClick={()=>{setCat("All");setQ("");pick(0);}}>{e.srcdesc}</button>
            </li>))}
        </ul>
      </div>
    </div></section>

    <section className="record"><div className="wrap">
      <div className="rhead">
        <span>The record — {SITE.range}</span>
        <span>{cat==="All"&&!q ? totalEntries+" entries" : counts.reduce((a,b)=>a+b,0)+" matching entries"}</span>
      </div>
      <div className="grid">
        <nav className="archive" aria-label="Weekly archive">
          {STATS.trending.length>0 && <div>
            <div className="archive-h">Trending · last 30 days</div>
            {STATS.trending.map(t=>(
              <button key={t.category} className="trend-row" onClick={()=>viewCategory(t.category)}>
                <span className="trend-label">{t.category}</span>
                <div className="trend-track"><div className="trend-bar"
                  style={{width:(t.count/STATS.trending[0].count*100)+"%"}}/></div>
                <span className="trend-count">{t.count}</span>
              </button>))}
          </div>}

          {STATS.totals.length>0 && <div className="side-block">
            <div className="archive-h">All Categories</div>
            <PieChart data={STATS.totals} onSelect={viewCategory}/>
          </div>}

          <div className="archive-h side-block">Archive · {totalWeeks} weeks</div>
          {DATA.map((w,i)=>(
            <button key={w.week}
              className={"wk"+(!catView && i===idx?" active":"")+(counts[i]===0?" dim":"")}
              onClick={()=>pick(i)}>
              <span className="d">{w.week}</span>
              <span className="c">{counts[i]}</span>
            </button>))}
          <button className="wk allweeks-link" onClick={goWeeks}>
            <span className="d">View All Weeks →</span>
          </button>
        </nav>
        <div ref={readerRef}>
          <h2 className="wtitle">{catView ? cat : "Week of "+formatWeekRange(active.week)}
            <small>{shown.length} {shown.length===1?"entry":"entries"}{catView?" · all-time":(cat!=="All"?" · "+cat:"")}{q?' · "'+q+'"':""}
              {catView && <button className="clear-link" onClick={clearCatView}>✕ Back to weekly view</button>}
              {!catView && <ShareMenu weekLabel={active.week}/>}
            </small>
          </h2>
          {shown.length
            ? <div className="cards">{shown.map(e=><Card key={e.n} e={e}/>)}</div>
            : <div className="empty">{catView ? "No entries match this filter." : "No entries match this filter for this week."}<br/>{catView ? "Try clearing the filter." : "Try another week or clear the filter."}</div>}
        </div>
      </div>
    </div></section>
    </React.Fragment>}

    {view==="crimes" && <CrimeTracker onBack={goRecord}/>}

    {view==="weeks" && <section className="allweeks"><div className="wrap">
      <div className="eyebrow">Complete archive</div>
      <h1 className="aw-title">The Complete <span className="ledger">Ledger</span> of What's Been <span className="rights">Lost</span></h1>
      <p className="aw-sub">Every week on record, grouped by month — {totalEntries} entries across {totalWeeks} weeks, {SITE.range}.</p>

      <div className="aw-toolbar">
        <button className="aw-back" onClick={goRecord}>← Back to The Record</button>
        <select value={acat} onChange={e=>setAcat(e.target.value)} aria-label="Filter the archive by category">
          <option value="All">All categories</option>
          {CATS.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <input type="search" placeholder="Search all weeks…" value={aq}
          onChange={e=>setAq(e.target.value)} aria-label="Search the archive"/>
        <button className="aw-dl" onClick={()=>downloadArchive(awRows)}
          title="Download what's currently shown as a spreadsheet">⤓ Download Excel</button>
      </div>

      {(aq||acat!=="All") && <div className="aw-count">
        {awRows.length} matching {awRows.length===1?"entry":"entries"}
        <button className="clear-link" onClick={()=>{setAq("");setAcat("All");}}>✕ Clear filters</button>
      </div>}

      {awMonths.length>1 && <nav className="aw-jump" aria-label="Jump to month">
        {awMonths.map(m=><a key={m.key} href={"#m-"+m.key}>{m.label}</a>)}
      </nav>}

      {awMonths.map(m=>(
        <section key={m.key} id={"m-"+m.key} className="aw-month">
          <h2 className="aw-month-h">{m.label}<span>{m.count} {m.count===1?"entry":"entries"}</span></h2>
          {m.weeks.map(w=>(
            <div key={w.week} className="aw-week">
              <h3 className="aw-week-h">
                <button onClick={()=>jumpToWeek(w.week)}
                  title="Open this week in The Record">Week of {formatWeekRange(w.week)}</button>
                <span className="aw-week-c">{w.hits.length}</span>
              </h3>
              <ul className="aw-list">
                {w.hits.map(e=>(
                  <li key={e.n}>
                    <span className="aw-fn">{String(e.n).padStart(3,"0")}</span>
                    <span className="aw-body">
                      <span className="aw-head">{e.srcdesc}</span>
                      <span className="aw-meta">
                        {e.cat && <span className="aw-cat">{e.cat}</span>}
                        {e.outlet && <span>{e.outlet}</span>}
                        <span>{e.srcdate}</span>
                        {e.url && <a href={e.url} target="_blank" rel="noopener noreferrer">Read the source →</a>}
                      </span>
                    </span>
                  </li>))}
              </ul>
            </div>))}
        </section>))}

      {awMonths.length===0 && <div className="empty">
        No entries match this search.<br/>Try a different term or clear the filters.
      </div>}

      <div className="aw-foot">
        <button className="aw-back" onClick={goRecord}>← Back to The Record</button>
      </div>
    </div></section>}

    {view==="about" && <section className="about">
      <div className="about-hero" style={ABOUT_IMAGE?{backgroundImage:'url("'+ABOUT_IMAGE+'")'}:{}}>
        <div className="about-hero-overlay"></div>
        {!ABOUT_IMAGE && <div className="about-placeholder">
          <span>[ Image slot — add your hosted image URL ]</span>
        </div>}
        <div className="about-hero-inner">
          <div className="eyebrow">The Rights That Have Left of Us Project</div>
          <h1 className="about-title">About the <span className="rights">Rights</span> <span className="left">Left</span> Project</h1>
        </div>
      </div>
      <div className="about-body">
        {/* ==== EXAMPLE TEXT — replace everything below with your own story ==== */}
        <p className="lead">Rights Left is an independent, source-linked record of actions taken by the Trump administration and their documented effects on rights, institutions, the rule of law, and crimes against humanity.</p>
        <h2>How it started</h2>
        <p>This project began as a single spreadsheet, just a way to keep track of what was happening week by week without losing the thread. As Trump took office the 2nd time things happened as such a rapid clip I noticed news stories were being lost just in the sheer flood of action. What started as personal note-keeping grew into something worth sharing.</p>
        <p> At time of writing I am a 38 year old man who feels our Nations cause is being lost. As the kids say now, we have lost the plot. I have no grand hopes that this will lead people to stand up but at least I want to keep track of every that has been touched, tainted, destroyed and lost. The America that I knew growing up is going to look so vastly different when this is over, that I want people to remember what it was and what it held.</p>
        <h2>What we track</h2>
        <p> Every entry is tied to reporting from established outlets or to court and government records. The goal isn't commentary for its own sake it's a durable, checkable timeline that anyone can verify for themselves.</p>
        <div className="about-note">
          This is a critical record by design; the administration and its supporters dispute many of these characterizations. Every entry links to its source.
        </div>
      </div>
    </section>}

    <footer><div className="wrap">
      <div className="disc">
        <b>About this record.</b> Rights Left compiles actions of the second Trump administration that news organizations, courts, and government data have reported as harmful to rights, institutions, or the economy. It is a critical record by design; the administration and its supporters dispute many of these characterizations. Entries are drawn from outlets including CNN, Politico, NBC, NPR, the AP, Reuters, the Guardian, CBS, ABC and court filings — <b>verify each item against its linked source before relying on it.</b>
      </div>
      <div className="fmeta">
        <span>Rights Left</span><span>{totalEntries} entries · {totalWeeks} weeks</span>
        <span>{SITE.range}</span><span>Sources linked per entry</span>
      </div>
    </div></footer>

    {showSupport && <div className="modal-backdrop" onClick={()=>setShowSupport(false)}>
      <div className="modal" role="dialog" aria-modal="true" aria-label="Support the project"
        onClick={e=>e.stopPropagation()}>
        <button className="modal-close" aria-label="Close" onClick={()=>setShowSupport(false)}>×</button>
        <div className="eyebrow">Support the project</div>
        <h3>Help keep the record going</h3>
        <p>Rights Left is independent and takes real time to research, verify, and maintain. If it's useful to you, a contribution of any size helps keep it going. Thank you.</p>
        <div className="pay-options">
          {PAYPAL_URL && <a className="pay-btn paypal" href={PAYPAL_URL}
            target="_blank" rel="noopener noreferrer">Donate with PayPal</a>}
          {VENMO_URL && <a className="pay-btn venmo" href={VENMO_URL}
            target="_blank" rel="noopener noreferrer">Send with Venmo</a>}
          {!hasPay && <div className="pay-note">Payment links coming soon — add your PayPal or Venmo link in the settings at the top of the file.</div>}
        </div>
        <p className="pay-fine">Contributions are personal gifts of support, not tax-deductible donations, and are not affiliated with any campaign or organization.</p>
      </div>
    </div>}

    {showSubscribe && <div className="modal-backdrop" onClick={()=>setShowSubscribe(false)}>
      <div className="modal" role="dialog" aria-modal="true" aria-label="Subscribe to the newsletter"
        onClick={e=>e.stopPropagation()}>
        <button className="modal-close" aria-label="Close" onClick={()=>setShowSubscribe(false)}>×</button>
        <div className="eyebrow">Weekly digest</div>
        <h3>Get the record by email</h3>
        <p>A short recap of this week's approved entries, once a week. No spam, unsubscribe anytime.</p>
        {BUTTONDOWN_USERNAME
          ? <form action={"https://buttondown.com/api/emails/embed-subscribe/"+BUTTONDOWN_USERNAME}
              method="post" target="_blank" className="subscribe-form">
              <input type="email" name="email" required placeholder="you@example.com" aria-label="Email address"/>
              <input type="hidden" value="1" name="embed"/>
              <button type="submit" className="pay-btn subscribe-submit">Subscribe</button>
            </form>
          : <div className="pay-note">Signup coming soon — add your Buttondown username in the settings at the top of the file.</div>}
      </div>
    </div>}
  </React.Fragment>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
