name: Gather weekly entries

on:
  # TRIAL: GitHub's own `schedule` cron was landing 36-101 minutes late most
  # weeks (sometimes not firing at all — see chat from 2026-09-06). Switched
  # to an external trigger instead: cron-job.org calls the workflow_dispatch
  # API below at a precise time, using a repo-scoped PAT. GitHub Actions'
  # scheduler is best-effort by design (their own docs say so); an external
  # single-purpose scheduler doesn't share that congestion problem.
  #
  # TO REVERT: delete the "schedule:" trigger from cron-job.org (or just let
  # the free account lapse), then uncomment the two lines below.
  #   schedule:
  #     - cron: '7 13 * * 0'
  workflow_dispatch: {}      # this is what cron-job.org calls now, same as the manual "Run workflow" button always did

permissions:
  contents: write            # to commit the candidates file
  issues: write              # to open the review issue

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect candidate articles
        id: collect
        env:
          # Optional: set this secret + add "--draft" below to have the model
          # pre-fill category/event/impact. Remove both to keep it free/no-AI.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/gather.py            # add  --draft  to enable AI pre-fill

      - name: Commit candidates for review
        run: |
          git config user.name  "rights-left-bot"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/
          git commit -m "Gather candidates ${{ steps.collect.outputs.week }}" || echo "nothing to commit"
          git push

      - name: Open review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Review candidates — week of ${{ steps.collect.outputs.week }}" \
            --body "$(cat <<'BODY'
          **${{ steps.collect.outputs.count }} candidate items** were collected for the week of **${{ steps.collect.outputs.week }}**, in a review spreadsheet.

          **To approve:**
          1. Open `${{ steps.collect.outputs.file }}` in this repo and click the ⬇ (download) icon near the top of the file to save it to your computer.
          2. Open it in Excel. In the **Include?** column, pick `y` from the dropdown on every row you want to keep — the row highlights green so it's easy to see what you've approved. Category / Event / Impact are optional: leave them blank for the automatic enrichment step, or fill them in yourself if you'd rather. Save the file.
          3. Back on GitHub, open the `candidates` folder → **Add file** → **Upload files** → select your saved file (keep the same filename) → this replaces the original. Commit directly to `main`.
          4. Go to the **Actions** tab → **Ingest approved entries** → **Run workflow**. Leave the file box blank to use this week's file.

          The ingest step appends your approved rows into `data/Trump_Second_Term_Weekly_Tracker.xlsx` in the exact existing format and updates the totals automatically.
          BODY
          )"
